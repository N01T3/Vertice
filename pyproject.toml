[project]
name = "vertice-documentos"
version = "0.1.0"
description = "Ingestão generalista de documentos de engenharia — IA leitora, RT decisor"
readme = ".md/VERTICE-arquitetura.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cad = ["ezdxf>=1.3"]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1.1"]
planilha = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
packages = ["core"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "openpyxl.*", "docx.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["A002", "N818", "N813"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI exige Depends(...) como valor padrão de parâmetro — é o
# mecanismo de injeção de dependência da própria biblioteca, não o
# "objeto mutável compartilhado" que B008 existe para pegar.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
